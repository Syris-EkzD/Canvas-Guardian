name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/core-1-activity-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CORE-2A focused synthetic tests
        if: github.base_ref == 'feat/core-1-activity-api'
        run: node --test test/core-api.test.js test/core-canvas.test.js test/activity-query.test.js test/runtime-import-safety.test.js

      - name: Run tests
        run: npm test

      - name: Audit production dependencies for high severity advisories
        run: npm audit --omit=dev --audit-level=high
